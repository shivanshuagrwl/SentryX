# Push a tag like `v1.0.0` and this builds SentryxSetup.exe / SENTRYX.pkg /
# sentryx.deb on their native OSes and attaches all three to a GitHub
# Release — so anyone can go to the repo's Releases page, download one
# file for their OS, and double-click it. No local Go/Inno
# Setup/dpkg-deb needed on their end.
name: Release installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {} # lets you run it manually from the Actions tab too

jobs:
  # Cross-compiles every OS/arch binary once, on Linux — `make dist` is
  # pure Go (no cgo, no bpf compile), so one runner can produce all of
  # them. Every later job just downloads this instead of rebuilding.
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Resolve dependencies (go.sum isn't committed yet)
        run: go mod tidy
      - name: Derive version from the pushed tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - run: make dist VERSION=${{ steps.ver.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  build-linux-deb:
    needs: build-dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: chmod +x dist/* installers/linux/build_deb.sh
      - run: VERSION=${{ github.ref_name }} ./installers/linux/build_deb.sh amd64
      - uses: actions/upload-artifact@v4
        with:
          name: sentryx-linux-installer
          path: sentryx_*_amd64.deb

  build-macos-pkg:
    needs: build-dist
    runs-on: macos-latest # Apple Silicon runner — matches the arm64 dist binaries below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: chmod +x dist/* installers/macos/build_pkg.sh
      - run: VERSION=${{ github.ref_name }} ./installers/macos/build_pkg.sh arm64
      - uses: actions/upload-artifact@v4
        with:
          name: sentryx-macos-installer
          path: SENTRYX-arm64.pkg

  build-windows-installer:
    needs: build-dist
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Compile installer
        shell: pwsh
        run: |
          # pwsh, not bash: Git Bash on Windows runners auto-rewrites any
          # "/..." argument into a Windows path (so Unix-style paths reach
          # native .exe files correctly), which also mangles Inno Setup's
          # /D switch and made ISCC.exe think it had been given two script
          # filenames. pwsh does no such rewriting.
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installers\windows\sentryx.iss
      - uses: actions/upload-artifact@v4
        with:
          name: sentryx-windows-installer
          path: installers/windows/Output/SentryxSetup.exe

  # Only this last job needs GitHub's release-write permission — everything
  # above just builds and hands artifacts up the chain.
  publish-release:
    needs: [build-linux-deb, build-macos-pkg, build-windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/sentryx-linux-installer/sentryx_*_amd64.deb
            artifacts/sentryx-macos-installer/SENTRYX-arm64.pkg
            artifacts/sentryx-windows-installer/SentryxSetup.exe
          generate_release_notes: true
