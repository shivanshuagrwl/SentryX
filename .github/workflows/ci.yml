name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Resolve dependencies (go.sum isn't committed yet)
        run: go mod tidy
      - run: go build ./cmd/sentryx-setup/... ./cmd/sentryx-dashboard/... ./cmd/sxctl/...
      - run: go vet ./cmd/sentryx-setup/... ./cmd/sentryx-dashboard/...
      - run: gofmt -l . | tee /tmp/fmt.out && test ! -s /tmp/fmt.out
